<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0a0d12">
<title>T-BOX · 布局编辑</title>

<script src="version.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;-webkit-user-drag:none;margin:0;padding:0;}
  html,body{height:100%;width:100%;height:100vh;height:100dvh;width:100vw;
    overflow:hidden;background:#1a1c20;
    font-family:"Rajdhani","Oswald",system-ui,-apple-system,sans-serif;
    color:#e8eef3;user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;position:fixed;inset:0;
    -webkit-text-size-adjust:100%;}
  #wrap{position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 45%,#1c2028 0%,#0e1216 60%,#06080b 100%);}
  #title{font-family:"Oswald",sans-serif;font-weight:700;
    font-size:clamp(36px,8vw,72px);letter-spacing:14px;color:#fff;
    text-shadow:0 0 30px rgba(79,209,255,.35),0 4px 24px rgba(0,0,0,.9);}
  #subtitle{font-family:"Rajdhani",sans-serif;font-weight:600;
    font-size:13px;letter-spacing:6px;color:#c8d7e0;opacity:.7;
    text-transform:uppercase;}
  #hint{font-family:"Rajdhani",sans-serif;font-weight:600;
    font-size:12px;letter-spacing:3px;color:#4fd1ff;opacity:.9;
    text-transform:uppercase;margin-top:10px;}
  #spinner{width:44px;height:44px;border-radius:50%;
    border:2px solid rgba(79,209,255,.2);
    border-top-color:#4fd1ff;
    animation:spin 1s linear infinite;margin-top:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #manualBtn{margin-top:16px;
    display:flex;align-items:center;justify-content:center;
    min-width:160px;height:42px;padding:0 22px;
    border:1px solid rgba(79,209,255,.7);border-radius:3px;
    background:rgba(79,209,255,.12);color:#4fd1ff;
    font-family:"Oswald",sans-serif;font-weight:700;
    font-size:13px;letter-spacing:4px;cursor:pointer;
    text-transform:uppercase;text-decoration:none;
    transition:background .15s,box-shadow .15s,color .15s;}
  #manualBtn:hover{background:rgba(79,209,255,.25);color:#fff;
    box-shadow:0 0 20px rgba(79,209,255,.35);}
</style>
</head>
<body>
  <div id="wrap">
    <div id="title">T-BOX</div>
    <div id="subtitle">布局编辑 · 就地</div>
    <div id="spinner"></div>
    <div id="hint">正在进入游戏内编辑模式…</div>
    <a id="manualBtn" href="game.html?edit=1">手动进入</a>
  </div>

  <script>
    (function(){
      "use strict";
      var target = 'game.html?edit=1';
      var t = setTimeout(function(){
        try { window.location.replace(target); }
        catch(e){ window.location.href = target; }
      }, 600);
      window.addEventListener('pageshow', function(){
        clearTimeout(t);
        setTimeout(function(){
          try { window.location.replace(target); }
          catch(e){ window.location.href = target; }
        }, 200);
      });
    })();
  </script>
</body>
</html>
